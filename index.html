  <main>
    <div id="root" style="border: none;"></div>

    <script>
      const menuBtn = document.getElementById('menuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      menuBtn?.addEventListener('click', () => mobileMenu.classList.toggle('open'));
      document.querySelectorAll('#mobileMenu a').forEach(a => a.addEventListener('click', () => mobileMenu.classList.remove('open')));

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('is-visible');
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      const testimonials = [
        {
          text: '"A Dona do Chopp fez do nosso casamento uma festa inesquecível! Os convidados ficaram encantados com a bomba vintage servindo chopp. Foi a atração da noite!"',
          name: 'Carlos Mendes',
          role: 'Casamento na Praia',
          avatar: 'C'
        },
        {
          text: '"Todo mundo comentava a originalidade. Além de lindo, o atendimento foi impecável e o chopp estava geladíssimo do começo ao fim."',
          name: 'Fernanda Lima',
          role: 'Aniversário Particular',
          avatar: 'F'
        },
        {
          text: '"Levamos para um evento corporativo e virou o ponto alto da noite. Visual diferente, estrutura bonita e experiência memorável."',
          name: 'Rafael Nunes',
          role: 'Evento Corporativo',
          avatar: 'R'
        },
        {
          text: '"A praia já era linda, mas a Dona do Chopp deixou tudo ainda mais especial. Foi divertido, elegante e muito refrescante."',
          name: 'Juliana Costa',
          role: 'Open Bar na Praia',
          avatar: 'J'
        }
      ];

      let testimonialIndex = 0;
      const textEl = document.getElementById('testimonialText');
      const nameEl = document.getElementById('testimonialName');
      const roleEl = document.getElementById('testimonialRole');
      const avatarEl = document.getElementById('testimonialAvatar');
      const dotsWrap = document.getElementById('testimonialDots');

      function renderDots() {
        dotsWrap.innerHTML = '';
        testimonials.forEach((_, i) => {
          const dot = document.createElement('button');
          dot.className = 'testimonial-dot' + (i === testimonialIndex ? ' active' : '');
          dot.addEventListener('click', () => {
            testimonialIndex = i;
            renderTestimonial();
          });
          dotsWrap.appendChild(dot);
        });
      }

      function renderTestimonial() {
        const t = testimonials[testimonialIndex];
        textEl.textContent = t.text;
        nameEl.textContent = t.name;
        roleEl.textContent = t.role;
        avatarEl.textContent = t.avatar;
        renderDots();
      }

      document.getElementById('prevTestimonial')?.addEventListener('click', () => {
        testimonialIndex = (testimonialIndex - 1 + testimonials.length) % testimonials.length;
        renderTestimonial();
      });
      document.getElementById('nextTestimonial')?.addEventListener('click', () => {
        testimonialIndex = (testimonialIndex + 1) % testimonials.length;
        renderTestimonial();
      });
      renderTestimonial();
    </script>
